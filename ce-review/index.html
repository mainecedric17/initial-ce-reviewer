<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CE Review</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">

    <a class="logo">
        CE Review
    </a>


    <nav>

        <button id="homeBtn">
            Home
        </button>

        <button id="subjectsBtn">
            Subjects
        </button>

    </nav>


</header>





<main>


<section id="homeSection" class="hero">


<div class="hero-content">


<p class="eyebrow">
Civil Engineering Review Platform
</p>


<h1>
Practice with purpose.
<br>
Prepare with confidence.
</h1>



<p class="description">

A practice platform for Civil Engineering
students preparing for their licensure examination.

</p>



<button id="startBtn" class="primary-button">

Start Reviewing

</button>



</div>


</section>







<section id="subjectsSection" class="subjects hidden">


<div class="section-heading">


<p class="eyebrow">
Subjects
</p>


<h2>
Choose Subject
</h2>


<p>
Select a topic to start your practice quiz.
</p>


</div>




<div id="subjectsContainer" class="subjects-grid">


</div>


</section>







<section id="quizSection" class="quiz hidden">


<div class="quiz-box">


<p id="subjectTitle"></p>


<p id="questionNumber"></p>



<div class="progress">

<div id="progressBar"></div>

</div>





<h2 id="questionText">

</h2>




<div id="choicesContainer">

</div>





<button id="nextBtn" class="primary-button">

Next

</button>




<p id="resultText">

</p>


<button id="restartBtn" class="secondary-button hidden">

Restart Quiz

</button>


</div>


</section>



</main>






<footer>

CE Review Project

</footer>



<script src="script.js"></script>


</body>


</html>
